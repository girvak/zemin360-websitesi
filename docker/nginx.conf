server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Statik dışa aktarımda (next.config.ts → output: "export") sayfalar
    # hackathon.html gibi dosyalar olarak üretilir. Ziyaretçi /hackathon adresine
    # geldiğinde .html uzantılı dosyaya düşmesi gerekir. $uri'yi dizin olarak
    # denemiyoruz; out/ içinde her sayfanın yanında aynı adlı bir dizin
    # (RSC .txt yükleri) bulunduğu için dizin listesine düşme riski olur.
    location = / {
        try_files /index.html =404;
    }

    location / {
        # =404 ile bitiyor: /404.html'i doğrudan servis etmek yanıtı 200 yapardı.
        # Doğru durum kodunu aşağıdaki error_page yönergesi üretir.
        try_files $uri.html $uri $uri/index.html =404;
    }

    # .webmanifest nginx'in mime.types haritasında yok; server seviyesinde bir
    # types bloğu kalıtılan haritanın tamamını değiştireceği için yalnızca bu
    # dosyanın varsayılan türünü geçersiz kılıyoruz.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # İçerik hash'i taşıyan varlıklar; uzun süre önbelleklenebilir.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ~* \.(?:png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # HTML her zaman doğrulanmalı; yoksa dağıtım sonrası eski sayfa servis edilir.
    location ~* \.html$ {
        add_header Cache-Control "public, no-cache, must-revalidate";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Temel güvenlik başlıkları
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        application/xml
        text/xml;

    # Konteyner sağlık kontrolü
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
