# Cloudflare Workers (statik varlıklar) — `npx wrangler deploy` bu dosyayı okur.
# Worker kodu yok; out/ doğrudan servis edilir. public/_headers ve
# public/_redirects derlemede out/'a kopyalanır ve burada da geçerlidir.
name = "zemin360"
compatibility_date = "2026-10-01"

[assets]
directory = "./out"
# /hackathon → hackathon.html; bulunamayan adresler 404.html ile 404 döner.
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
