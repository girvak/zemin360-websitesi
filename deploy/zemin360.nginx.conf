# Zemin360 — sunucudaki (host) nginx için server bloğu.
#
# Kurulum (Debian/Ubuntu):
#   sudo cp deploy/zemin360.nginx.conf /etc/nginx/sites-available/zemin360
#   sudo ln -s /etc/nginx/sites-available/zemin360 /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# RHEL/CentOS/Alma (sites-available yoktur):
#   sudo cp deploy/zemin360.nginx.conf /etc/nginx/conf.d/zemin360.conf
#
# TLS:  sudo certbot --nginx -d zemin360.com -d www.zemin360.com
#       certbot 80 bloğunu kendisi yönlendirmeye çevirir.

# Cache-Control'ü location'lar yerine tek bir map ile veriyoruz. Sebep: nginx'te
# bir location içinde add_header kullanılırsa server seviyesindeki add_header'lar
# O LOCATION İÇİN DEVRE DIŞI KALIR. Böyle yapılınca statik varlıklar güvenlik
# başlıklarını kaybediyordu. map + tek add_header ile hepsi her yanıtta geçerli.
map $uri $zemin_cache_control {
    default                                          "public, no-cache, must-revalidate";
    "~^/_next/static/"                               "public, max-age=31536000, immutable";
    "~*\.(?:png|jpg|jpeg|gif|webp|svg|ico|woff2?)$"  "public, max-age=2592000";
}

server {
    listen 80;
    listen [::]:80;
    server_name zemin360.com www.zemin360.com;

    # Derlenmiş statik site buraya kopyalanır (deploy/deploy.sh bunu yapar).
    root /var/www/zemin360;
    index index.html;

    access_log /var/log/nginx/zemin360.access.log;
    error_log /var/log/nginx/zemin360.error.log;

    # Next statik dışa aktarımı (next.config.ts → output: "export") sayfaları
    # hackathon.html gibi dosyalar olarak üretir; ziyaretçi /hackathon adresine
    # geldiğinde .html dosyasına düşmesi gerekir. $uri'yi DİZİN olarak
    # denemiyoruz: out/ içinde her sayfanın yanında aynı adlı bir dizin
    # (RSC .txt yükleri) var, yoksa dizin listesine düşme riski oluşur.
    location = / {
        try_files /index.html =404;
    }

    location / {
        # =404 ile bitiyor: /404.html'i doğrudan servis etmek yanıtı 200 yapardı.
        # Doğru durum kodunu aşağıdaki error_page üretir.
        try_files $uri.html $uri $uri/index.html =404;
    }

    # .webmanifest nginx'in mime.types haritasında yok. Server seviyesinde bir
    # types bloğu kalıtılan haritanın TAMAMINI değiştirip CSS/JS türlerini
    # bozacağı için yalnızca bu dosyanın varsayılan türünü geçersiz kılıyoruz.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Bu iki location yalnızca erişim kaydını kapatır; başlıklar map'ten gelir.
    location /_next/static/ {
        access_log off;
    }

    location ~* \.(?:png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        access_log off;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Tüm yanıtlarda geçerli başlıklar
    add_header Cache-Control $zemin_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        application/xml
        text/xml;
}
